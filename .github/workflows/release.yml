name: Release

"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to build and update
        required: true
        type: string
      channel:
        description: Update channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: read

concurrency:
  group: codex-theme-switcher-release
  # GitHub Actions added multi-pending concurrency queues in May 2026.
  queue: max
  cancel-in-progress: false

env:
  UPDATE_REPOSITORY: irons163/codex-theme-switcher
  SPARKLE_VERSION: "2.9.1"
  SPARKLE_ARCHIVE_SHA256: c0dde519fd2a43ddfc6a1eb76aec284d7d888fe281414f9177de3164d98ba4c7

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      build_version: ${{ steps.release.outputs.build_version }}
      minimum_system_version: ${{ steps.release.outputs.minimum_system_version }}
      channel: ${{ steps.release.outputs.channel }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REPOSITORY" != "$UPDATE_REPOSITORY" ]]; then
            echo "This release workflow is bound to ${UPDATE_REPOSITORY}, not ${GITHUB_REPOSITORY}." >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "release" ]]; then
            RELEASE_TAG="$EVENT_RELEASE_TAG"
            if [[ "$EVENT_RELEASE_PRERELEASE" == "true" ]]; then
              CHANNEL="beta"
            else
              CHANNEL="stable"
            fi
          else
            RELEASE_TAG="$INPUT_RELEASE_TAG"
            CHANNEL="$INPUT_CHANNEL"
          fi

          if [[ -z "${RELEASE_TAG:-}" ]]; then
            echo "A release tag is required." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^[vV]?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag must be a version such as v0.3.0 or v0.3.0-beta.1: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ "$CHANNEL" != "stable" && "$CHANNEL" != "beta" ]]; then
            echo "Unsupported release channel: ${CHANNEL}" >&2
            exit 1
          fi

          SOURCE_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ || "$SOURCE_SHA" != "$TAG_SHA" ]]; then
            echo "Checked out source does not match immutable tag ${RELEASE_TAG}." >&2
            exit 1
          fi
          git fetch --no-tags origin \
            "${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor \
              "$SOURCE_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "Release source ${SOURCE_SHA} is not on ${DEFAULT_BRANCH}." >&2
            exit 1
          fi

          RELEASE_JSON="$(gh api "repos/${UPDATE_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          IS_DRAFT="$(jq -r '.draft' <<<"$RELEASE_JSON")"
          IS_PRERELEASE="$(jq -r '.prerelease' <<<"$RELEASE_JSON")"
          if [[ "$IS_DRAFT" == "true" ]]; then
            echo "Release ${RELEASE_TAG} is still a draft. Publish it before running this workflow." >&2
            exit 1
          fi
          if [[ "$CHANNEL" == "beta" && "$IS_PRERELEASE" != "true" ]]; then
            echo "Beta channel requires a GitHub prerelease." >&2
            exit 1
          fi
          if [[ "$CHANNEL" == "stable" && "$IS_PRERELEASE" == "true" ]]; then
            echo "Stable channel cannot publish from a GitHub prerelease." >&2
            exit 1
          fi

          LATEST_STABLE_TAG="$(
            gh api "repos/${UPDATE_REPOSITORY}/releases/latest" \
              --jq '.tag_name' 2>/dev/null || true
          )"
          if [[ "$CHANNEL" == "stable" && "$LATEST_STABLE_TAG" != "$RELEASE_TAG" ]]; then
            echo "Stable release ${RELEASE_TAG} must be the repository's latest release." >&2
            exit 1
          fi
          if [[ "$CHANNEL" == "beta" && -z "$LATEST_STABLE_TAG" ]]; then
            echo "A Stable release is required before publishing the first Beta." >&2
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#refs/tags/}"
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          RELEASE_VERSION="${RELEASE_VERSION#V}"

          INFO_JSON="$(
            python3 - <<'PY'
          import base64
          import binascii
          import json
          import os
          import plistlib

          with open("Packaging/Info.plist", "rb") as handle:
              info = plistlib.load(handle)

          required = [
              "CFBundleShortVersionString",
              "CFBundleVersion",
              "LSMinimumSystemVersion",
          ]
          missing = [key for key in required if not str(info.get(key, "")).strip()]
          if missing:
              raise SystemExit(f"Packaging/Info.plist is missing: {', '.join(missing)}")
          if info.get("SUAllowsInsecureUpdates") is True:
              raise SystemExit("SUAllowsInsecureUpdates must not be enabled.")

          try:
              encoded_public_key = os.environ["SPARKLE_PUBLIC_ED_KEY"]
          except KeyError:
              raise SystemExit("Missing required secret: SPARKLE_PUBLIC_ED_KEY")
          if not encoded_public_key.strip():
              raise SystemExit("Missing required secret: SPARKLE_PUBLIC_ED_KEY")
          try:
              public_key = base64.b64decode(encoded_public_key, validate=True)
          except (binascii.Error, ValueError) as error:
              raise SystemExit(f"SPARKLE_PUBLIC_ED_KEY is not valid base64: {error}")
          if len(public_key) != 32:
              raise SystemExit("SPARKLE_PUBLIC_ED_KEY must decode to a 32-byte Ed25519 public key.")

          print(json.dumps({
              "shortVersion": str(info["CFBundleShortVersionString"]),
              "buildVersion": str(info["CFBundleVersion"]),
              "minimumSystemVersion": str(info["LSMinimumSystemVersion"]),
          }))
          PY
          )"

          INFO_SHORT_VERSION="$(jq -r '.shortVersion' <<<"$INFO_JSON")"
          BUILD_VERSION="$(jq -r '.buildVersion' <<<"$INFO_JSON")"
          MINIMUM_SYSTEM_VERSION="$(jq -r '.minimumSystemVersion' <<<"$INFO_JSON")"

          if [[ "$RELEASE_VERSION" != "$INFO_SHORT_VERSION" ]]; then
            echo "Release tag version (${RELEASE_VERSION}) does not match CFBundleShortVersionString (${INFO_SHORT_VERSION})." >&2
            exit 1
          fi
          if [[ ! "$BUILD_VERSION" =~ ^[0-9]+$ ]]; then
            echo "CFBundleVersion must be an unsigned integer, got: ${BUILD_VERSION}" >&2
            exit 1
          fi
          if [[ "$CHANNEL" == "beta" && "$RELEASE_VERSION" != *-* ]]; then
            echo "Beta version must include a prerelease suffix, for example 0.3.0-beta.1." >&2
            exit 1
          fi
          if [[ "$CHANNEL" == "stable" && "$RELEASE_VERSION" == *-* ]]; then
            echo "Stable version must not include a prerelease suffix." >&2
            exit 1
          fi

          APPCAST_CACHE="$(mktemp -d)"
          trap 'rm -rf "$APPCAST_CACHE"' EXIT
          APPCAST_ASSETS="$(
            gh api \
              --paginate \
              "repos/${UPDATE_REPOSITORY}/releases?per_page=100" \
              --jq '
                .[]
                | select(.draft == false)
                | .assets[]?
                | select(
                    .name
                    | test("^appcast(-beta)?-(arm64|x86_64)\\.xml$")
                  )
                | [.id, .name]
                | @tsv
              '
          )"
          if [[ -n "$APPCAST_ASSETS" ]]; then
            appcast_index=0
            while IFS=$'\t' read -r asset_id asset_name; do
              if [[ ! "$asset_id" =~ ^[0-9]+$ ]]; then
                echo "Invalid GitHub Release asset ID: ${asset_id}" >&2
                exit 1
              fi
              appcast_path="${APPCAST_CACHE}/${appcast_index}-${asset_name}"
              gh api \
                -H "Accept: application/octet-stream" \
                "repos/${UPDATE_REPOSITORY}/releases/assets/${asset_id}" \
                > "$appcast_path"
              if [[ ! -s "$appcast_path" ]]; then
                echo "Downloaded appcast is empty: ${asset_name}" >&2
                exit 1
              fi
              appcast_index=$((appcast_index + 1))
            done <<< "$APPCAST_ASSETS"
          fi
          python3 scripts/validate-release-build-order.py \
            --appcast-directory "$APPCAST_CACHE" \
            --current-build "$BUILD_VERSION" \
            --current-version "$RELEASE_VERSION" \
            --current-tag "$RELEASE_TAG"

          RESOLVED_SPARKLE_VERSION="$(
            jq -r '
              .pins[]
              | select(.identity == "sparkle")
              | .state.version
            ' Package.resolved
          )"
          if [[ "$RESOLVED_SPARKLE_VERSION" != "$SPARKLE_VERSION" ]]; then
            echo "Package.resolved Sparkle version (${RESOLVED_SPARKLE_VERSION}) does not match workflow version (${SPARKLE_VERSION})." >&2
            exit 1
          fi
          if ! grep -Fq "exact: \"${SPARKLE_VERSION}\"" Package.swift; then
            echo "Package.swift must pin Sparkle exactly to ${SPARKLE_VERSION}." >&2
            exit 1
          fi

          NOTES_DIR="docs/release-notes/v${RELEASE_VERSION}"
          for language in en zh-Hant zh-Hans fr es ja ko; do
            notes_file="${NOTES_DIR}/release-notes.${language}.md"
            if [[ ! -s "$notes_file" ]]; then
              echo "Missing or empty localized release notes: ${notes_file}" >&2
              exit 1
            fi
          done
          mapfile -t NOTE_FILES < <(
            find "$NOTES_DIR" \
              -maxdepth 1 \
              -type f \
              -name 'release-notes.*' \
              -print \
              | sort
          )
          if [[ "${#NOTE_FILES[@]}" -ne 7 ]]; then
            echo "${NOTES_DIR} must contain exactly seven release-note files." >&2
            printf '%s\n' "${NOTE_FILES[@]:-none}" >&2
            exit 1
          fi

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_version=${RELEASE_VERSION}"
            echo "build_version=${BUILD_VERSION}"
            echo "minimum_system_version=${MINIMUM_SYSTEM_VERSION}"
            echo "channel=${CHANNEL}"
            echo "source_sha=${SOURCE_SHA}"
          } >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Select latest Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -n 1)"
          if [[ -z "${XCODE_APP:-}" ]]; then
            echo "No Xcode installation found." >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=${XCODE_APP}/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          swift --version
          node --version

      - name: Validate scripts and appcast generator
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/*.sh
          scripts/test-generate-sparkle-appcast.sh
          scripts/test-validate-release-build-order.sh

      - name: Run Swift tests
        run: swift test

      - name: Run Node tests and syntax checks
        run: |
          npm test
          npm run check

  build:
    needs:
      - prepare
      - verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: release-production
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: apple-silicon
            runner: macos-15
          - arch: x86_64
            label: intel
            runner: macos-15-intel
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Validate native runner architecture
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          RUNNER_ARCH="$(uname -m)"
          if [[ "$RUNNER_ARCH" != "$TARGET_ARCH" ]]; then
            echo "Runner architecture ${RUNNER_ARCH} does not match ${TARGET_ARCH}." >&2
            exit 1
          fi

      - name: Select latest Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -n 1)"
          if [[ -z "${XCODE_APP:-}" ]]; then
            echo "No Xcode installation found." >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=${XCODE_APP}/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Validate release secrets
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_CERTIFICATE_P12_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_TEAM_ID \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID \
            APPLE_API_PRIVATE_KEY_BASE64 \
            SPARKLE_ED_PRIVATE_KEY \
            SPARKLE_PUBLIC_ED_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Configure Developer ID and notarization credentials
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077

          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"

          python3 - "$CERTIFICATE_PATH" "$API_KEY_PATH" <<'PY'
          import base64
          import binascii
          import os
          import sys

          try:
              certificate = base64.b64decode(
                  os.environ["APPLE_CERTIFICATE_P12_BASE64"],
                  validate=True,
              )
              api_key = base64.b64decode(
                  os.environ["APPLE_API_PRIVATE_KEY_BASE64"],
                  validate=True,
              )
          except (binascii.Error, ValueError) as error:
              raise SystemExit(f"Invalid base64 release credential: {error}")

          with open(sys.argv[1], "wb") as handle:
              handle.write(certificate)
          with open(sys.argv[2], "wb") as handle:
              handle.write(api_key)
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import \
            "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          printf '%s\n' "$IDENTITIES"
          CODE_SIGN_IDENTITY="$(
            sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' <<<"$IDENTITIES" \
              | grep "(${APPLE_TEAM_ID})" \
              | head -n 1
          )"
          if [[ -z "$CODE_SIGN_IDENTITY" ]]; then
            echo "No Developer ID Application identity matches APPLE_TEAM_ID=${APPLE_TEAM_ID}." >&2
            exit 1
          fi

          xcrun notarytool store-credentials "CODEX_THEME_SWITCHER_NOTARY" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"

          {
            echo "RELEASE_KEYCHAIN_PATH=${KEYCHAIN_PATH}"
            echo "CODE_SIGN_IDENTITY=${CODE_SIGN_IDENTITY}"
          } >> "$GITHUB_ENV"

      - name: Download Sparkle signing tools
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/Sparkle-${SPARKLE_VERSION}.tar.xz"
          TOOLS_DIR="$RUNNER_TEMP/sparkle-tools"
          curl \
            --fail \
            --location \
            --retry 3 \
            --proto '=https' \
            --tlsv1.2 \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            --output "$ARCHIVE_PATH"
          printf '%s  %s\n' "$SPARKLE_ARCHIVE_SHA256" "$ARCHIVE_PATH" \
            | shasum -a 256 --check
          mkdir -p "$TOOLS_DIR"
          tar -xJf "$ARCHIVE_PATH" -C "$TOOLS_DIR"
          SIGN_UPDATE="$(find "$TOOLS_DIR" -type f -path '*/bin/sign_update' | head -n 1)"
          if [[ -z "${SIGN_UPDATE:-}" ]]; then
            echo "Sparkle distribution does not contain bin/sign_update." >&2
            exit 1
          fi
          chmod +x "$SIGN_UPDATE"
          codesign --verify --deep --strict --verbose=2 "$SIGN_UPDATE"
          echo "SPARKLE_SIGN_UPDATE=${SIGN_UPDATE}" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and sign update
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          ARCH_LABEL: ${{ matrix.label }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
          NOTARY_PROFILE: CODEX_THEME_SWITCHER_NOTARY
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          chmod +x scripts/build-release-dmg.sh
          scripts/build-release-dmg.sh

      - name: Upload architecture artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove temporary release credentials
        if: always()
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set +e
          if [[ -n "${RELEASE_KEYCHAIN_PATH:-}" && -f "$RELEASE_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN_PATH"
          fi
          rm -f \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"

  publish:
    needs:
      - prepare
      - verify
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: collected-artifacts
          merge-multiple: true

      - name: Upload installers, symbols, and localized release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail

          ARM64_DMG="collected-artifacts/CodexThemeSwitcher-${RELEASE_VERSION}-apple-silicon.dmg"
          X86_64_DMG="collected-artifacts/CodexThemeSwitcher-${RELEASE_VERSION}-intel.dmg"
          ARM64_DSYM="collected-artifacts/CodexThemeSwitcher-${RELEASE_VERSION}-apple-silicon.dSYM.zip"
          X86_64_DSYM="collected-artifacts/CodexThemeSwitcher-${RELEASE_VERSION}-intel.dSYM.zip"
          for artifact in \
            "$ARM64_DMG" \
            "$X86_64_DMG" \
            "$ARM64_DSYM" \
            "$X86_64_DSYM"; do
            if [[ ! -s "$artifact" ]]; then
              echo "Missing expected release artifact: ${artifact}" >&2
              exit 1
            fi
          done
          if [[ ! -s "${ARM64_DMG}.edSignature" || ! -s "${X86_64_DMG}.edSignature" ]]; then
            echo "Both DMGs must have Sparkle EdDSA signature sidecars." >&2
            exit 1
          fi

          NOTES_DIR="docs/release-notes/v${RELEASE_VERSION}"
          NOTE_ASSETS=()
          for language in en zh-Hant zh-Hans fr es ja ko; do
            notes_file="${NOTES_DIR}/release-notes.${language}.md"
            if [[ ! -s "$notes_file" ]]; then
              echo "Missing or empty localized release notes: ${notes_file}" >&2
              exit 1
            fi
            NOTE_ASSETS+=("$notes_file")
          done

          SYMBOL_ASSETS=("$ARM64_DSYM" "$X86_64_DSYM")

          CHECKSUMS_PATH="collected-artifacts/SHA256SUMS"
          shasum -a 256 \
            "$ARM64_DMG" \
            "$X86_64_DMG" \
            "${SYMBOL_ASSETS[@]}" \
            | sed 's#  collected-artifacts/#  #' \
            > "$CHECKSUMS_PATH"

          gh release upload \
            "$RELEASE_TAG" \
            "$ARM64_DMG" \
            "$X86_64_DMG" \
            "${SYMBOL_ASSETS[@]}" \
            "${NOTE_ASSETS[@]}" \
            "$CHECKSUMS_PATH" \
            --repo "$UPDATE_REPOSITORY" \
            --clobber

      - name: Generate and publish signed Stable or Beta appcasts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
          MINIMUM_SYSTEM_VERSION: ${{ needs.prepare.outputs.minimum_system_version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail

          ARM64_DMG="collected-artifacts/CodexThemeSwitcher-${RELEASE_VERSION}-apple-silicon.dmg"
          X86_64_DMG="collected-artifacts/CodexThemeSwitcher-${RELEASE_VERSION}-intel.dmg"
          if [[ ! -s "$ARM64_DMG" || ! -s "$X86_64_DMG" ]]; then
            echo "Both exact architecture DMGs are required." >&2
            exit 1
          fi
          ARM64_NAME="$(basename "$ARM64_DMG")"
          X86_64_NAME="$(basename "$X86_64_DMG")"
          ARM64_SIGNATURE="$(tr -d '[:space:]' < "${ARM64_DMG}.edSignature")"
          X86_64_SIGNATURE="$(tr -d '[:space:]' < "${X86_64_DMG}.edSignature")"
          ARM64_SIZE="$(wc -c < "$ARM64_DMG" | tr -d '[:space:]')"
          X86_64_SIZE="$(wc -c < "$X86_64_DMG" | tr -d '[:space:]')"

          RELEASE_JSON="$(gh api "repos/${UPDATE_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          RELEASE_NAME="$(jq -r '.name // ""' <<<"$RELEASE_JSON")"
          RELEASE_NOTES="$(jq -r '.body // ""' <<<"$RELEASE_JSON")"
          PUBLISHED_AT="$(jq -r '.published_at // ""' <<<"$RELEASE_JSON")"

          asset_url() {
            local asset_name="$1"
            jq -r --arg name "$asset_name" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              <<<"$RELEASE_JSON" \
              | head -n 1
          }

          ARM64_URL="$(asset_url "$ARM64_NAME")"
          X86_64_URL="$(asset_url "$X86_64_NAME")"
          if [[ -z "$ARM64_URL" || -z "$X86_64_URL" ]]; then
            echo "Unable to resolve uploaded DMG URLs from GitHub Release." >&2
            exit 1
          fi

          LOCALIZED_RELEASE_NOTES_LINKS=""
          for language in en zh-Hant zh-Hans fr es ja ko; do
            notes_name="release-notes.${language}.md"
            notes_url="$(asset_url "$notes_name")"
            if [[ -z "$notes_url" ]]; then
              echo "Unable to resolve uploaded release notes: ${notes_name}" >&2
              exit 1
            fi
            LOCALIZED_RELEASE_NOTES_LINKS+="${language}=${notes_url}"$'\n'
          done

          FEED_DIR="signed-appcasts"
          rm -rf "$FEED_DIR"
          mkdir -p "$FEED_DIR"

          OUTPUT_DIR="$FEED_DIR" \
          OUTPUT_BASENAME="appcast" \
          APP_NAME="Codex Theme Switcher" \
          REPOSITORY_SLUG="$UPDATE_REPOSITORY" \
          RELEASE_TAG="$RELEASE_TAG" \
          RELEASE_NAME="$RELEASE_NAME" \
          RELEASE_NOTES="$RELEASE_NOTES" \
          LOCALIZED_RELEASE_NOTES_LINKS="$LOCALIZED_RELEASE_NOTES_LINKS" \
          BUILD_VERSION="$BUILD_VERSION" \
          PUBLISHED_AT="$PUBLISHED_AT" \
          MINIMUM_SYSTEM_VERSION="$MINIMUM_SYSTEM_VERSION" \
          CHANNEL_LABEL="$CHANNEL" \
          ARM64_URL="$ARM64_URL" \
          ARM64_SIZE="$ARM64_SIZE" \
          ARM64_ED_SIGNATURE="$ARM64_SIGNATURE" \
          X86_64_URL="$X86_64_URL" \
          X86_64_SIZE="$X86_64_SIZE" \
          X86_64_ED_SIGNATURE="$X86_64_SIGNATURE" \
          scripts/generate-sparkle-appcast.sh

          if [[ "$CHANNEL" == "beta" ]]; then
            mv "$FEED_DIR/appcast-arm64.xml" "$FEED_DIR/appcast-beta-arm64.xml"
            mv "$FEED_DIR/appcast-x86_64.xml" "$FEED_DIR/appcast-beta-x86_64.xml"
            FEED_HOST_TAG="$(
              gh api "repos/${UPDATE_REPOSITORY}/releases/latest" --jq '.tag_name'
            )"
            if [[ -z "$FEED_HOST_TAG" || "$FEED_HOST_TAG" == "$RELEASE_TAG" ]]; then
              echo "A previous stable release is required to host Beta appcasts." >&2
              exit 1
            fi
            FEED_ASSETS=(
              "$FEED_DIR/appcast-beta-arm64.xml"
              "$FEED_DIR/appcast-beta-x86_64.xml"
            )
          else
            cp "$FEED_DIR/appcast-arm64.xml" "$FEED_DIR/appcast-beta-arm64.xml"
            cp "$FEED_DIR/appcast-x86_64.xml" "$FEED_DIR/appcast-beta-x86_64.xml"
            FEED_HOST_TAG="$RELEASE_TAG"
            FEED_ASSETS=(
              "$FEED_DIR/appcast-arm64.xml"
              "$FEED_DIR/appcast-x86_64.xml"
              "$FEED_DIR/appcast-beta-arm64.xml"
              "$FEED_DIR/appcast-beta-x86_64.xml"
            )
          fi

          for appcast in "${FEED_ASSETS[@]}"; do
            grep -q 'sparkle:edSignature="[A-Za-z0-9+/].*=="' "$appcast" \
              || {
                echo "Missing Sparkle EdDSA signature: ${appcast}" >&2
                exit 1
              }
            for language in en zh-Hant zh-Hans fr es ja ko; do
              grep -Fq "<sparkle:releaseNotesLink xml:lang=\"${language}\">" "$appcast" \
                || {
                  echo "Missing ${language} release notes in ${appcast}" >&2
                  exit 1
                }
            done
          done

          gh release upload \
            "$FEED_HOST_TAG" \
            "${FEED_ASSETS[@]}" \
            --repo "$UPDATE_REPOSITORY" \
            --clobber
