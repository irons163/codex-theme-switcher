name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to build and update
        required: true
        type: string
      channel:
        description: Update channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: write

env:
  UPDATE_REPOSITORY: irons163/codex-theme-switcher
  SPARKLE_VERSION: "2.9.1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      build_version: ${{ steps.release.outputs.build_version }}
      minimum_system_version: ${{ steps.release.outputs.minimum_system_version }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Resolve and validate release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REPOSITORY" != "$UPDATE_REPOSITORY" ]]; then
            echo "This release workflow is bound to ${UPDATE_REPOSITORY}, not ${GITHUB_REPOSITORY}." >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "release" ]]; then
            RELEASE_TAG="$EVENT_RELEASE_TAG"
            if [[ "$EVENT_RELEASE_PRERELEASE" == "true" ]]; then
              CHANNEL="beta"
            else
              CHANNEL="stable"
            fi
          else
            RELEASE_TAG="$INPUT_RELEASE_TAG"
            CHANNEL="$INPUT_CHANNEL"
          fi

          if [[ -z "${RELEASE_TAG:-}" ]]; then
            echo "A release tag is required." >&2
            exit 1
          fi
          if [[ "$CHANNEL" != "stable" && "$CHANNEL" != "beta" ]]; then
            echo "Unsupported release channel: ${CHANNEL}" >&2
            exit 1
          fi

          RELEASE_JSON="$(gh api "repos/${UPDATE_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          IS_DRAFT="$(jq -r '.draft' <<<"$RELEASE_JSON")"
          IS_PRERELEASE="$(jq -r '.prerelease' <<<"$RELEASE_JSON")"
          if [[ "$IS_DRAFT" == "true" ]]; then
            echo "Release ${RELEASE_TAG} is still a draft. Publish it before running this workflow." >&2
            exit 1
          fi
          if [[ "$CHANNEL" == "beta" && "$IS_PRERELEASE" != "true" ]]; then
            echo "Beta channel requires a GitHub prerelease." >&2
            exit 1
          fi
          if [[ "$CHANNEL" == "stable" && "$IS_PRERELEASE" == "true" ]]; then
            echo "Stable channel cannot publish from a GitHub prerelease." >&2
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#refs/tags/}"
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          RELEASE_VERSION="${RELEASE_VERSION#V}"

          INFO_JSON="$(
            python3 - <<'PY'
          import base64
          import binascii
          import json
          import os
          import plistlib

          with open("Packaging/Info.plist", "rb") as handle:
              info = plistlib.load(handle)

          required = [
              "CFBundleShortVersionString",
              "CFBundleVersion",
              "LSMinimumSystemVersion",
          ]
          missing = [key for key in required if not str(info.get(key, "")).strip()]
          if missing:
              raise SystemExit(f"Packaging/Info.plist is missing: {', '.join(missing)}")
          if info.get("SUAllowsInsecureUpdates") is True:
              raise SystemExit("SUAllowsInsecureUpdates must not be enabled.")

          try:
              encoded_public_key = os.environ["SPARKLE_PUBLIC_ED_KEY"]
          except KeyError:
              raise SystemExit("Missing required secret: SPARKLE_PUBLIC_ED_KEY")
          if not encoded_public_key.strip():
              raise SystemExit("Missing required secret: SPARKLE_PUBLIC_ED_KEY")
          try:
              public_key = base64.b64decode(encoded_public_key, validate=True)
          except (binascii.Error, ValueError) as error:
              raise SystemExit(f"SPARKLE_PUBLIC_ED_KEY is not valid base64: {error}")
          if len(public_key) != 32:
              raise SystemExit("SPARKLE_PUBLIC_ED_KEY must decode to a 32-byte Ed25519 public key.")

          print(json.dumps({
              "shortVersion": str(info["CFBundleShortVersionString"]),
              "buildVersion": str(info["CFBundleVersion"]),
              "minimumSystemVersion": str(info["LSMinimumSystemVersion"]),
          }))
          PY
          )"

          INFO_SHORT_VERSION="$(jq -r '.shortVersion' <<<"$INFO_JSON")"
          BUILD_VERSION="$(jq -r '.buildVersion' <<<"$INFO_JSON")"
          MINIMUM_SYSTEM_VERSION="$(jq -r '.minimumSystemVersion' <<<"$INFO_JSON")"

          if [[ "$RELEASE_VERSION" != "$INFO_SHORT_VERSION" ]]; then
            echo "Release tag version (${RELEASE_VERSION}) does not match CFBundleShortVersionString (${INFO_SHORT_VERSION})." >&2
            exit 1
          fi
          if [[ ! "$BUILD_VERSION" =~ ^[0-9]+$ ]]; then
            echo "CFBundleVersion must be an unsigned integer, got: ${BUILD_VERSION}" >&2
            exit 1
          fi
          if [[ "$CHANNEL" == "beta" && "$RELEASE_VERSION" != *-* ]]; then
            echo "Beta version must include a prerelease suffix, for example 0.3.0-beta.1." >&2
            exit 1
          fi
          if [[ "$CHANNEL" == "stable" && "$RELEASE_VERSION" == *-* ]]; then
            echo "Stable version must not include a prerelease suffix." >&2
            exit 1
          fi

          NOTES_DIR="docs/release-notes/v${RELEASE_VERSION}"
          for language in en zh-Hant zh-Hans fr es ja ko; do
            notes_file="${NOTES_DIR}/release-notes.${language}.md"
            if [[ ! -s "$notes_file" ]]; then
              echo "Missing or empty localized release notes: ${notes_file}" >&2
              exit 1
            fi
          done

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_version=${RELEASE_VERSION}"
            echo "build_version=${BUILD_VERSION}"
            echo "minimum_system_version=${MINIMUM_SYSTEM_VERSION}"
            echo "channel=${CHANNEL}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: apple-silicon
          - arch: x86_64
            label: intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Select latest Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -n 1)"
          if [[ -z "${XCODE_APP:-}" ]]; then
            echo "No Xcode installation found." >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=${XCODE_APP}/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Validate release secrets
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_CERTIFICATE_P12_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_TEAM_ID \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID \
            APPLE_API_PRIVATE_KEY_BASE64 \
            SPARKLE_ED_PRIVATE_KEY \
            SPARKLE_PUBLIC_ED_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Configure Developer ID and notarization credentials
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"

          python3 - "$CERTIFICATE_PATH" "$API_KEY_PATH" <<'PY'
          import base64
          import os
          import sys

          with open(sys.argv[1], "wb") as handle:
              handle.write(base64.b64decode(os.environ["APPLE_CERTIFICATE_P12_BASE64"]))
          with open(sys.argv[2], "wb") as handle:
              handle.write(base64.b64decode(os.environ["APPLE_API_PRIVATE_KEY_BASE64"]))
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import \
            "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          printf '%s\n' "$IDENTITIES"
          CODE_SIGN_IDENTITY="$(
            sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' <<<"$IDENTITIES" \
              | grep "(${APPLE_TEAM_ID})" \
              | head -n 1
          )"
          if [[ -z "$CODE_SIGN_IDENTITY" ]]; then
            echo "No Developer ID Application identity matches APPLE_TEAM_ID=${APPLE_TEAM_ID}." >&2
            exit 1
          fi

          xcrun notarytool store-credentials "CODEX_THEME_SWITCHER_NOTARY" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"

          {
            echo "RELEASE_KEYCHAIN_PATH=${KEYCHAIN_PATH}"
            echo "CODE_SIGN_IDENTITY=${CODE_SIGN_IDENTITY}"
          } >> "$GITHUB_ENV"

      - name: Download Sparkle signing tools
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/Sparkle-${SPARKLE_VERSION}.tar.xz"
          TOOLS_DIR="$RUNNER_TEMP/sparkle-tools"
          curl \
            --fail \
            --location \
            --retry 3 \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            --output "$ARCHIVE_PATH"
          mkdir -p "$TOOLS_DIR"
          tar -xJf "$ARCHIVE_PATH" -C "$TOOLS_DIR"
          SIGN_UPDATE="$(find "$TOOLS_DIR" -type f -path '*/bin/sign_update' | head -n 1)"
          if [[ -z "${SIGN_UPDATE:-}" ]]; then
            echo "Sparkle distribution does not contain bin/sign_update." >&2
            exit 1
          fi
          chmod +x "$SIGN_UPDATE"
          echo "SPARKLE_SIGN_UPDATE=${SIGN_UPDATE}" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and sign update
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          ARCH_LABEL: ${{ matrix.label }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
          NOTARY_PROFILE: CODEX_THEME_SWITCHER_NOTARY
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          chmod +x scripts/build-release-dmg.sh
          scripts/build-release-dmg.sh

      - name: Upload architecture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

      - name: Remove temporary keychain
        if: always()
        shell: bash
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set +e
          if [[ -n "${RELEASE_KEYCHAIN_PATH:-}" && -f "$RELEASE_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN_PATH"
          fi

  publish:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: collected-artifacts
          merge-multiple: true

      - name: Upload installers, symbols, and localized release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail

          ARM64_DMG="$(
            find collected-artifacts -maxdepth 1 -type f -name '*-apple-silicon.dmg' | head -n 1
          )"
          X86_64_DMG="$(
            find collected-artifacts -maxdepth 1 -type f -name '*-intel.dmg' | head -n 1
          )"
          if [[ -z "${ARM64_DMG:-}" || -z "${X86_64_DMG:-}" ]]; then
            echo "Both Apple Silicon and Intel DMGs are required." >&2
            exit 1
          fi
          if [[ ! -s "${ARM64_DMG}.edSignature" || ! -s "${X86_64_DMG}.edSignature" ]]; then
            echo "Both DMGs must have Sparkle EdDSA signature sidecars." >&2
            exit 1
          fi

          NOTES_DIR="docs/release-notes/v${RELEASE_VERSION}"
          NOTE_ASSETS=()
          for language in en zh-Hant zh-Hans fr es ja ko; do
            notes_file="${NOTES_DIR}/release-notes.${language}.md"
            if [[ ! -s "$notes_file" ]]; then
              echo "Missing or empty localized release notes: ${notes_file}" >&2
              exit 1
            fi
            NOTE_ASSETS+=("$notes_file")
          done

          SYMBOL_ASSETS=()
          while IFS= read -r symbols_file; do
            [[ -n "$symbols_file" ]] && SYMBOL_ASSETS+=("$symbols_file")
          done < <(find collected-artifacts -maxdepth 1 -type f -name '*.dSYM.zip' | sort)
          if [[ "${#SYMBOL_ASSETS[@]}" -ne 2 ]]; then
            echo "Expected two dSYM archives, found ${#SYMBOL_ASSETS[@]}." >&2
            exit 1
          fi

          gh release upload \
            "$RELEASE_TAG" \
            "$ARM64_DMG" \
            "$X86_64_DMG" \
            "${SYMBOL_ASSETS[@]}" \
            "${NOTE_ASSETS[@]}" \
            --repo "$UPDATE_REPOSITORY" \
            --clobber

      - name: Generate and publish signed Stable or Beta appcasts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
          MINIMUM_SYSTEM_VERSION: ${{ needs.prepare.outputs.minimum_system_version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail

          ARM64_DMG="$(
            find collected-artifacts -maxdepth 1 -type f -name '*-apple-silicon.dmg' | head -n 1
          )"
          X86_64_DMG="$(
            find collected-artifacts -maxdepth 1 -type f -name '*-intel.dmg' | head -n 1
          )"
          ARM64_NAME="$(basename "$ARM64_DMG")"
          X86_64_NAME="$(basename "$X86_64_DMG")"
          ARM64_SIGNATURE="$(tr -d '[:space:]' < "${ARM64_DMG}.edSignature")"
          X86_64_SIGNATURE="$(tr -d '[:space:]' < "${X86_64_DMG}.edSignature")"
          ARM64_SIZE="$(wc -c < "$ARM64_DMG" | tr -d '[:space:]')"
          X86_64_SIZE="$(wc -c < "$X86_64_DMG" | tr -d '[:space:]')"

          RELEASE_JSON="$(gh api "repos/${UPDATE_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          RELEASE_NAME="$(jq -r '.name // ""' <<<"$RELEASE_JSON")"
          RELEASE_NOTES="$(jq -r '.body // ""' <<<"$RELEASE_JSON")"
          PUBLISHED_AT="$(jq -r '.published_at // ""' <<<"$RELEASE_JSON")"

          asset_url() {
            local asset_name="$1"
            jq -r --arg name "$asset_name" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              <<<"$RELEASE_JSON" \
              | head -n 1
          }

          ARM64_URL="$(asset_url "$ARM64_NAME")"
          X86_64_URL="$(asset_url "$X86_64_NAME")"
          if [[ -z "$ARM64_URL" || -z "$X86_64_URL" ]]; then
            echo "Unable to resolve uploaded DMG URLs from GitHub Release." >&2
            exit 1
          fi

          LOCALIZED_RELEASE_NOTES_LINKS=""
          for language in en zh-Hant zh-Hans fr es ja ko; do
            notes_name="release-notes.${language}.md"
            notes_url="$(asset_url "$notes_name")"
            if [[ -z "$notes_url" ]]; then
              echo "Unable to resolve uploaded release notes: ${notes_name}" >&2
              exit 1
            fi
            LOCALIZED_RELEASE_NOTES_LINKS+="${language}=${notes_url}"$'\n'
          done

          FEED_DIR="signed-appcasts"
          rm -rf "$FEED_DIR"
          mkdir -p "$FEED_DIR"

          OUTPUT_DIR="$FEED_DIR" \
          OUTPUT_BASENAME="appcast" \
          APP_NAME="Codex Theme Switcher" \
          REPOSITORY_SLUG="$UPDATE_REPOSITORY" \
          RELEASE_TAG="$RELEASE_TAG" \
          RELEASE_NAME="$RELEASE_NAME" \
          RELEASE_NOTES="$RELEASE_NOTES" \
          LOCALIZED_RELEASE_NOTES_LINKS="$LOCALIZED_RELEASE_NOTES_LINKS" \
          BUILD_VERSION="$BUILD_VERSION" \
          PUBLISHED_AT="$PUBLISHED_AT" \
          MINIMUM_SYSTEM_VERSION="$MINIMUM_SYSTEM_VERSION" \
          CHANNEL_LABEL="$CHANNEL" \
          ARM64_URL="$ARM64_URL" \
          ARM64_SIZE="$ARM64_SIZE" \
          ARM64_ED_SIGNATURE="$ARM64_SIGNATURE" \
          X86_64_URL="$X86_64_URL" \
          X86_64_SIZE="$X86_64_SIZE" \
          X86_64_ED_SIGNATURE="$X86_64_SIGNATURE" \
          scripts/generate-sparkle-appcast.sh

          if [[ "$CHANNEL" == "beta" ]]; then
            mv "$FEED_DIR/appcast-arm64.xml" "$FEED_DIR/appcast-beta-arm64.xml"
            mv "$FEED_DIR/appcast-x86_64.xml" "$FEED_DIR/appcast-beta-x86_64.xml"
            FEED_HOST_TAG="$(
              gh api "repos/${UPDATE_REPOSITORY}/releases/latest" --jq '.tag_name'
            )"
            if [[ -z "$FEED_HOST_TAG" || "$FEED_HOST_TAG" == "$RELEASE_TAG" ]]; then
              echo "A previous stable release is required to host Beta appcasts." >&2
              exit 1
            fi
            FEED_ASSETS=(
              "$FEED_DIR/appcast-beta-arm64.xml"
              "$FEED_DIR/appcast-beta-x86_64.xml"
            )
          else
            cp "$FEED_DIR/appcast-arm64.xml" "$FEED_DIR/appcast-beta-arm64.xml"
            cp "$FEED_DIR/appcast-x86_64.xml" "$FEED_DIR/appcast-beta-x86_64.xml"
            FEED_HOST_TAG="$RELEASE_TAG"
            FEED_ASSETS=(
              "$FEED_DIR/appcast-arm64.xml"
              "$FEED_DIR/appcast-x86_64.xml"
              "$FEED_DIR/appcast-beta-arm64.xml"
              "$FEED_DIR/appcast-beta-x86_64.xml"
            )
          fi

          for appcast in "${FEED_ASSETS[@]}"; do
            grep -q 'sparkle:edSignature="[A-Za-z0-9+/].*=="' "$appcast" \
              || {
                echo "Missing Sparkle EdDSA signature: ${appcast}" >&2
                exit 1
              }
            for language in en zh-Hant zh-Hans fr es ja ko; do
              grep -Fq "<sparkle:releaseNotesLink xml:lang=\"${language}\">" "$appcast" \
                || {
                  echo "Missing ${language} release notes in ${appcast}" >&2
                  exit 1
                }
            done
          done

          gh release upload \
            "$FEED_HOST_TAG" \
            "${FEED_ASSETS[@]}" \
            --repo "$UPDATE_REPOSITORY" \
            --clobber
